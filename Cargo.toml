[workspace]
resolver = "2"
members = [
  "apps/api",
  "apps/worker",
  "crates/contracts",
  "crates/domain",
  "crates/evidence",
  "crates/observation",
  "crates/intelligence",
  "crates/storage-postgres",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
