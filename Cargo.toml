[workspace]
resolver = "2"
members = [
  "apps/api",
  "apps/worker",
  "crates/contracts",
  "crates/domain",
  "crates/evidence",
  "crates/observation",
  "crates/intelligence",
  "crates/storage-postgres",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
axum = { version = "0.8.8", default-features = false, features = ["http1", "json", "tokio"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "json"] }
tokio = { version = "1.48.0", default-features = false }
uuid = { version = "1.24.1", default-features = false, features = ["std"] }
serde_json = "1"
thiserror = "2"
tower = { version = "0.5.2", default-features = false, features = ["util"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# SCOPE-001 file gate: a function longer than 100 lines fails the build. The 60-line warning
# stays a review gate rather than a second, unreliable analyzer.
too_many_lines = "deny"
