[package]
name = "linggan-evidence"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
linggan-contracts = { path = "../contracts" }
linggan-storage-postgres = { path = "../storage-postgres" }
