name: Agent work item
description: Track a protected or multi-stage work package; ordinary fast-lane changes can use the PR summary.
title: "[WORK] "
labels:
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Use docs/governance/agent-collaboration.md to choose the delivery lane. This optional tracking form records an existing authorization; it does not replace it or grant external permissions. Fast-lane work may use only the PR summary. The package coordinator checks scope, dependencies and evidence before marking ready-for-agent. Required fields are form hints, not a CI or authorization gate.

  - type: textarea
    id: scope_authority
    attributes:
      label: SCOPE and authority
      description: Cite the active SCOPE, accepted decision, user authorization, or governance rule that permits this work. State any authority that is explicitly absent.
      placeholder: "Authorized by ...; does not authorize ..."
    validations:
      required: true

  - type: textarea
    id: goal_and_scope
    attributes:
      label: Goal, in scope, and out of scope
      description: State the user-visible or verifiable goal, then separate what is included from what must not be changed.
      placeholder: |
        Goal:
        In scope:
        Out of scope:
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and blockers
      description: Reference blocking Issues, decisions, external conditions, or write None.
      placeholder: "Blocked by #... / None - can start immediately"
    validations:
      required: true

  - type: textarea
    id: file_ownership
    attributes:
      label: Proposed exclusive, shared, and forbidden files
      description: Give bounded paths and ownership. The coordinator records necessary direct dependencies before editing, resolves package-internal integration, and escalates cross-package conflicts or new product/permission scope under the collaboration protocol.
      placeholder: |
        Proposed exclusive files:
        Proposed shared files:
        Forbidden files:
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List independently checkable outcomes. A build, HTTP 200, task completion, or generated text cannot stand in for the business result.
      placeholder: "- [ ] ..."
    validations:
      required: true

  - type: textarea
    id: validation_plan
    attributes:
      label: Validation plan
      description: List planned checks, expected proof, and external prerequisites. Actual commands/results belong in the later PR and handoff.
      placeholder: |
        Planned checks:
        Expected evidence:
        External prerequisites:
    validations:
      required: true

  - type: textarea
    id: stop_and_escalation
    attributes:
      label: Stop and escalation conditions
      description: State unresolved product choices, cross-package authority conflicts, and unapproved data/permission/external effects. Routine package-internal implementation and conflict repair follow the collaboration protocol.
      placeholder: "Stop when ...; escalate to ..."
    validations:
      required: true

  - type: textarea
    id: completion_requirements
    attributes:
      label: Completion reporting requirements
      description: State which Design, Code, Automated, Real-chain, Deploy, Mog acceptance, Proved, and Not proved layers the future handoff must report. Do not invent actual results at Issue creation.
      placeholder: |
        Required completion layers:
        Required proof boundaries:
        Layers expected to be N/A or NOT VERIFIED:
    validations:
      required: true
