name: OCR adoption (saved-output contracts)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ocr-adoption.yml'
      - 'crates/evidence/src/ocr_adoption.rs'
      - 'crates/evidence/src/ocr_adoption/**'
      - 'crates/evidence/src/ocr_layering.rs'
      - 'crates/evidence/src/lib.rs'
      - 'crates/evidence/examples/ocr_adoption_replay.rs'
      - 'crates/evidence/tests/ocr_adoption.rs'
      - 'crates/evidence/Cargo.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
permissions:
  contents: read
concurrency:
  group: ocr-adoption-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  synthetic-ocr-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Matching Rust
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt
          rustup default 1.95.0
      - name: Synthetic adoption and historical line selection
        run: |
          cargo test -p linggan-evidence --test ocr_adoption --locked
          cargo test -p linggan-evidence --lib ocr_layering:: --locked
          cargo build -p linggan-evidence --example ocr_adoption_replay --locked
      - name: Offline replay rejects malformed input without leaking text
        run: |
          set +e
          printf '%s\n' '{"private":"synthetic-canary"}' | target/debug/examples/ocr_adoption_replay > /tmp/ocr-out 2> /tmp/ocr-err
          result=$?
          set -e
          test "$result" -eq 2
          test ! -s /tmp/ocr-out
          test "$(cat /tmp/ocr-err)" = ocr_adoption_replay_failed
      - name: Formatting, governance and diff
        run: |
          rustfmt --check --edition 2024 --config skip_children=true crates/evidence/src/ocr_adoption.rs crates/evidence/src/ocr_adoption/*.rs crates/evidence/tests/ocr_adoption.rs crates/evidence/examples/ocr_adoption_replay.rs
          bash scripts/check-project-governance.sh origin/main
          git diff --check
