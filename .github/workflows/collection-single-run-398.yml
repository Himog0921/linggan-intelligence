name: Collection single run 398
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: collection-single-run-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  collection-proof:
    if: github.head_ref == 'codex/collection-single-run-398'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Matching Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt
          rustup default 1.95.0
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/collection-target" >> "$GITHUB_ENV"
      - name: Locked workspace regression
        run: cargo test --workspace --locked
      - name: Plugin fixtures, contracts and candidate reproducibility
        env:
          # Existing calendar-text fixtures exercise the workstation's Beijing timezone.
          TZ: Asia/Shanghai
        run: |
          npm ci --prefix plugins/linggan-intelligence-browser --ignore-scripts
          npm --prefix plugins/linggan-intelligence-browser run verify
          npm --prefix plugins/linggan-intelligence-browser run test:douyin
      - name: Isolated populated formal browser and PostgreSQL
        env:
          NODE_PATH: ${{ runner.temp }}/collection-browser/node_modules
          COLLECTION_PROOF_DIR: ${{ runner.temp }}/collection-proof
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/collection-browser/browsers
        run: |
          npm --prefix "$RUNNER_TEMP/collection-browser" install --no-package-lock --ignore-scripts playwright@1.57.0
          node "$RUNNER_TEMP/collection-browser/node_modules/playwright/cli.js" install --with-deps chromium
          export COLLECTION_RUN_BROWSER_PROOF=1
          export COLLECTION_RUN_REGRESSION_PROOF=1
          export COLLECTION_PROOF_NODE="$(command -v node)"
          bash scripts/test-collection-single-run-postgres.sh
      - name: Governance and changed source format
        run: |
          bash scripts/check-project-governance.sh origin/main
          bash scripts/verify-ui-design-handbook.sh
          git diff --check
          git diff --name-only origin/main -- '*.rs' | xargs -r rustfmt --edition 2024 --config skip_children=true --check
          node --check scripts/test-collection-single-run-ui.cjs
      - name: Retain synthetic populated UI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: collection-398-populated-proof
          path: ${{ runner.temp }}/collection-proof
          retention-days: 7
          if-no-files-found: warn
