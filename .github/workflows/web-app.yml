name: Web app (WEB-REACT-001)
# Called by delivery.yml after its single preflight and conservative change routing.
on:
  workflow_call:
permissions:
  contents: read
jobs:
  web-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Locked install
        run: npm ci --prefix apps/web --ignore-scripts --no-audit --no-fund
      - name: Reject legacy production UI and duplicate React roots
        run: node scripts/check-web-react-boundary.mjs && node --test scripts/check-web-react-boundary.test.mjs
      - name: Typecheck, lint, unit and component tests, production build
        run: npm --prefix apps/web run verify
      - name: LIDS sources and offline examples stay synchronized
        run: npm --prefix apps/web run lids:verify
      - name: Runtime preparation script reuses a matching build
        run: |
          export LINGGAN_WEB_NODE="$(command -v node)"
          revision="$(git rev-parse --short HEAD)"
          bash scripts/runtime/prepare-web.sh --build "$revision"
          bash scripts/runtime/prepare-web.sh --check "$revision"

  real-chain-browser-proof:
    needs: web-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Matching Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt
          rustup default 1.95.0
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/web-app-target" >> "$GITHUB_ENV"
      - name: Locked install and browser
        run: |
          npm ci --prefix apps/web --ignore-scripts --no-audit --no-fund
          npm ci --prefix apps/pi-adapter --ignore-scripts --no-audit --no-fund
          npx --prefix apps/web playwright install --with-deps chromium
      - name: API route regression
        run: cargo test -p linggan-api --bins --locked -- local_web::web_app_tests local_web::corpus_shell_api local_web::evidence_ local_web::content_workbench_sources_api::tests
      - name: C0 offline contracts and real React main path (no database or provider)
        env:
          C0_PREVIEW_PROOF_DIR: ${{ runner.temp }}/web-app-proof/c0-offline
        run: |
          npm --prefix apps/web run build
          cargo test -p linggan-intelligence --test note_interpretation_offline --locked
          cargo test -p linggan-api --bins --locked -- local_web::offline_preview_tests
          export C0_PREVIEW_NODE="$(command -v node)"
          cargo test -p linggan-api --bins --locked offline_preview_browser_main_path -- --ignored --nocapture
      - name: Isolated PostgreSQL + Axum + React browser proof (synthetic credential only)
        env:
          WEB_APP_PROOF_DIR: ${{ runner.temp }}/web-app-proof
        run: |
          export WEB_APP_PROOF_NODE="$(command -v node)"
          bash scripts/test-web-app-postgres.sh
      - name: Note material readonly React main path (owned synthetic PostgreSQL)
        env:
          WEB_APP_PROOF_DIR: ${{ runner.temp }}/web-app-proof/note-material
        run: bash scripts/test-research-dossier-postgres.sh --note-material-ui
      - name: AI-GEN1 material input contracts (synthetic PostgreSQL only)
        run: |
          cargo test -p linggan-evidence --lib material_ --locked
          cargo test -p linggan-worker --bin linggan-note-material --locked
          bash scripts/test-research-dossier-postgres.sh --note-material
      - name: Web source formatting
        run: |
          # 只查本模块自己的 Rust 文件：local_web.rs 在主线上已有与本模块无关的格式偏差。
          rustfmt --edition 2024 --config skip_children=true --check \
            apps/api/src/local_web/web_app.rs apps/api/src/local_web/web_app_tests.rs apps/api/src/local_web/model_settings.rs \
            apps/api/src/local_web/corpus_shell_api.rs apps/api/src/local_web/creators_browser_tests.rs \
            apps/api/src/local_web/topic_map.rs apps/api/src/local_web/topic_workspace.rs \
            apps/api/src/local_web/topic_workspace_tests.rs apps/api/src/local_web/topic_browser_tests.rs \
            apps/api/src/local_web/evidence_browser_tests.rs apps/api/src/local_web/evidence_fixture.rs apps/api/src/local_web/evidence_seed.rs \
            apps/api/src/local_web/evidence_api_proof_tests.rs apps/api/src/local_web/evidence_guard_tests.rs \
            apps/api/src/local_web/creators.rs \
            crates/evidence/src/material_creation_comments.rs \
            crates/intelligence/src/content_workbench_sources.rs crates/intelligence/src/content_workbench_sources/materials.rs \
            crates/intelligence/src/content_workbench_sources/material_collection.rs crates/intelligence/src/content_workbench_sources/material_documents.rs \
            crates/intelligence/src/content_workbench/source_usage.rs crates/intelligence/tests/content_workbench_sources_postgres.rs
      - name: Comment study transaction and lifecycle regression (synthetic PostgreSQL)
        run: bash scripts/test-comment-study-productization-postgres.sh
      - name: Content workbench PostgreSQL contracts
        run: |
          cargo test -p linggan-intelligence --lib --locked -- content_workbench:: content_workbench_sources:: content_workbench_ai:: exact_spans_keep_overlaps_codepoints_and_long_repeated_patterns
          bash scripts/test-content-workbench-postgres.sh
      - name: Content workbench React browser and actual export proof
        env:
          CW_BROWSER_PROOF_DIR: ${{ runner.temp }}/workbench-proof
        run: |
          export CW_BROWSER_PROOF_NODE="$(command -v node)"
          bash scripts/test-content-workbench-postgres.sh --browser
      - name: Collection React module on disposable PostgreSQL
        env:
          COLLECTION_PROOF_DIR: ${{ runner.temp }}/collection-react-proof
          COLLECTION_RUN_BROWSER_PROOF: '1'
          COLLECTION_RUN_CORE_PROOF: '1'
        run: |
          npm --prefix apps/web run build
          export COLLECTION_PROOF_NODE="$(command -v node)"
          export NODE_PATH="$GITHUB_WORKSPACE/apps/web/node_modules"
          bash scripts/test-collection-single-run-postgres.sh
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: web-app-real-chain-proof
          path: |
            ${{ runner.temp }}/web-app-proof
            ${{ runner.temp }}/workbench-proof
            ${{ runner.temp }}/collection-react-proof
          retention-days: 7
          if-no-files-found: warn
