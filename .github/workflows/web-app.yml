name: Web app (WEB-REACT-001)
# Called by delivery.yml after its single preflight and conservative change routing.
on:
  workflow_call:
permissions:
  contents: read
jobs:
  web-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Locked install
        run: npm ci --prefix apps/web --ignore-scripts --no-audit --no-fund
      - name: Reject legacy production UI and duplicate React roots
        run: node scripts/check-web-react-boundary.mjs && node --test scripts/check-web-react-boundary.test.mjs
      - name: Typecheck, lint, unit and component tests, production build
        run: npm --prefix apps/web run verify
      - name: LIDS sources and offline examples stay synchronized
        run: npm --prefix apps/web run lids:verify
      - name: Runtime preparation script reuses a matching build
        run: |
          export LINGGAN_WEB_NODE="$(command -v node)"
          revision="$(git rev-parse --short HEAD)"
          bash scripts/runtime/prepare-web.sh --build "$revision"
          bash scripts/runtime/prepare-web.sh --check "$revision"
