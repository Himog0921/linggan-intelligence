name: Creator Workbench G5 React preview proof
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'apps/web/src/pages/workbench/CreatorWorkbenchPreviewPage.*'
      - 'apps/web/test/e2e/creator-workbench-g5.mjs'
      - '.github/workflows/creator-workbench-g5.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  g5-browser:
    if: startsWith(github.head_ref, 'preview/creator-workbench-') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked React toolchain and Chromium
        run: |
          npm ci --prefix apps/web --ignore-scripts --no-audit --no-fund
          npx --prefix apps/web playwright install --with-deps chromium
      - name: G5 six-viewport DEV route and interaction browser proof
        env:
          CW_G5_DIR: ${{ runner.temp }}/creator-workbench-g5
        run: node apps/web/test/e2e/creator-workbench-g5.mjs
      - name: Preserve six viewports, geometry and failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: creator-workbench-g5-browser-evidence
          path: ${{ runner.temp }}/creator-workbench-g5
          retention-days: 7
          if-no-files-found: warn
