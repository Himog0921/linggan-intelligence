name: Topic Map compact UI
on:
  pull_request:
    paths:
      - 'apps/api/src/local_web/topic_map.*'
      - 'apps/api/src/local_web/shell.*'
      - 'apps/api/src/local_web/lids_tokens.css'
      - 'apps/web/src/pages/topics/**'
      - 'apps/web/test/e2e/topic*'
      - 'apps/web/package-lock.json'
      - 'apps/api/src/local_web/topic_workspace*'
      - 'apps/api/src/local_web/web_app*'
      - '.github/workflows/topic-map-compact-ui.yml'
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
      - run: npm ci --prefix apps/web --ignore-scripts --no-audit --no-fund
      - name: React Topic contracts and components
        run: npm --prefix apps/web test -- src/pages/topics
      # Full real Axum/React/PostgreSQL proof and browser evidence live in web-app.yml.
