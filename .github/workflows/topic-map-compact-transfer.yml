name: Topic Map compact isolated transfer
on:
  push:
    branches: ['codex/topic-map-compact-382']
    paths: ['.github/workflows/topic-map-compact-transfer.yml']
permissions:
  contents: read
jobs:
  source:
    if: github.ref == 'refs/heads/codex/topic-map-compact-382'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Reconstruct only the approved frontend files
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/topic-map-compact"
          git worktree add --detach .worktrees/topic-map-compact-382 HEAD
          cd .worktrees/topic-map-compact-382
          python - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess
          blobs=['715551b64a6f72ddbb44fb9af7d8fa6811ed5a5a','727fd228d5672ad99902e5dfd69a54bb1ead78fd']
          compressed=b''
          for sha in blobs:
              obj=json.loads(subprocess.check_output(['gh','api','repos/Himog0921/linggan-intelligence/git/blobs/'+sha]))
              assert obj['encoding']=='base64'
              data=base64.b64decode(obj['content'])
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha
              compressed+=data
          assert hashlib.sha256(compressed).hexdigest()=='2e2ab3d8ef091baca0260288f97564ebe1bd886be65cb73648406f42810f4806'
          allowed={'apps/api/src/local_web/topic_map.css','apps/api/src/local_web/topic_map.js','apps/api/src/local_web/topic_map.rs','docs/README.md','docs/current-state.md','docs/data-contracts/topic-map-http.md','docs/design/README.md','docs/design/changes/topic-map-compact-382.md','docs/design/lids/migration-log.md','docs/governance/generated-artifacts-registry.md','docs/plans/active/topic-map-workflow-382.md','docs/progress/2026-10.md','scripts/test-topic-map-compact-ui.py','scripts/test-topic-map-ui.cjs'}
          rows=json.loads(lzma.decompress(compressed)); assert len(rows)==len(allowed)
          assert {r['path'] for r in rows}==allowed
          pending={}
          for row in rows:
              path=pathlib.Path(row['path']); assert not path.is_symlink()
              old=path.read_bytes() if path.exists() else b''
              if row['old']:
                  assert hashlib.sha1(b'blob '+str(len(old)).encode()+b'\0'+old).hexdigest()==row['old'], row['path']
              else:
                  assert not path.exists(), row['path']
              lines=old.decode().splitlines(keepends=True); parts=[]
              for piece in row['pieces']:
                  if isinstance(piece,str): parts.append(piece)
                  else:
                      assert isinstance(piece,list) and len(piece)==2 and all(type(i)==int for i in piece)
                      a,b=piece; assert 0<=a<=b<=len(lines)
                      parts.append(''.join(lines[a:b]))
              new=''.join(parts).encode()
              assert hashlib.sha256(new).hexdigest()==row['sha256'], row['path']
              pending[path]=new
          for path,data in pending.items():
              path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(data)
          subprocess.run(['git','add','--',*sorted(allowed)],check=True)
          print('Reconstructed and hash-verified',len(pending),'approved files.')
          PY
          git diff --cached --check
          node --check apps/api/src/local_web/topic_map.js
          node scripts/test-topic-map-ui.cjs | tee "$RUNNER_TEMP/topic-map-compact/ui.log"
          git diff --cached --stat > "$RUNNER_TEMP/topic-map-compact/diff-stat.txt"
      - name: Publish candidate to its isolated branch only
        shell: bash
        run: |
          set -euo pipefail
          cd .worktrees/topic-map-compact-382
          test "$(git ls-remote origin refs/heads/codex/topic-map-compact-382 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(topic-map): implement compact tree, persistent metrics and journey map/list UI' -m 'Refs #382; Claim TOPIC-MAP-COMPACT-382. Preserve production sources, statistics and command contracts.'
          git push origin HEAD:refs/heads/codex/topic-map-compact-382
          git rev-parse HEAD | tee "$RUNNER_TEMP/topic-map-compact/candidate-head.txt"
      - name: Full checkout governance checks
        shell: bash
        run: |
          set -euo pipefail
          cd .worktrees/topic-map-compact-382
          bash scripts/check-project-governance.sh c935f7e08e5d4a6192d41a7fe60f76d95eaaebba | tee "$RUNNER_TEMP/topic-map-compact/governance.log"
          bash scripts/verify-ui-design-handbook.sh | tee "$RUNNER_TEMP/topic-map-compact/design.log"
      - name: Install isolated browser test dependency
        if: success() || failure()
        run: python -m pip install playwright==1.57.0 && python -m playwright install --with-deps chromium
      - name: Actual browser interaction and layout proof
        if: success() || failure()
        shell: bash
        run: |
          set -euo pipefail
          cd .worktrees/topic-map-compact-382
          python scripts/test-topic-map-compact-ui.py --output "$RUNNER_TEMP/topic-map-compact/browser" 2>&1 | tee "$RUNNER_TEMP/topic-map-compact/browser.log"
      - name: Preserve exact candidate and verification receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: topic-map-compact-candidate
          path: ${{ runner.temp }}/topic-map-compact
          retention-days: 7
          if-no-files-found: error
