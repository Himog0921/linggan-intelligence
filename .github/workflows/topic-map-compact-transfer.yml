name: Topic Map readability verification
on:
  push:
    branches: ['codex/topic-map-compact-382']
    paths: ['.github/workflows/topic-map-compact-transfer.yml']
permissions:
  contents: read
jobs:
  readability:
    if: github.ref == 'refs/heads/codex/topic-map-compact-382'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
    env:
      PROOF: ${{ runner.temp }}/topic-map-readability-proof
      WORK: .worktrees/topic-map-compact-382
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Apply reviewed file edits with exact source and destination checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = d68442c7193a3e807238fd909e49e586d5efb9b8
          mkdir -p "$PROOF"
          git worktree add --detach "$WORK" "$GITHUB_SHA"
          python - <<'PY'
          import base64, hashlib, json, lzma, os, subprocess, urllib.request
          from pathlib import Path
          allowed={'apps/api/src/local_web/topic_map.js','apps/api/src/local_web/topic_map.css','docs/design/changes/topic-map-compact-382.md','docs/design/lids/migration-log.md','docs/progress/2026-10.md','scripts/test-topic-map-ui.cjs','scripts/test-topic-map-compact-ui.py'}
          req=urllib.request.Request('https://api.github.com/repos/Himog0921/linggan-intelligence/git/blobs/339cca42c7a948a82601e5e0cdc7930ea54a6017',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          obj=json.load(urllib.request.urlopen(req,timeout=30))
          data=lzma.decompress(base64.b64decode(base64.b64decode(obj['content'])))
          assert hashlib.sha256(data).hexdigest()=='0be8633dd5e3fd8f05efcb5e9120fef163ffb4093442f3169c4022ba7eb30a37'
          payload=json.loads(data)
          assert payload['base']=='d68442c7193a3e807238fd909e49e586d5efb9b8'
          assert set(payload['files'])==allowed
          root=Path(os.environ['WORK'])
          for name,change in payload['files'].items():
              file=root/name
              original=file.read_bytes()
              assert hashlib.sha256(original).hexdigest()==change['before'],name
              lines=original.decode().splitlines(keepends=True)
              for edit in reversed(change['edits']):
                  start,count=edit['start'],edit['delete']
                  assert isinstance(start,int) and isinstance(count,int) and 0<=start<=start+count<=len(lines)
                  lines[start:start+count]=edit['text'].splitlines(keepends=True)
              result=''.join(lines).encode()
              assert hashlib.sha256(result).hexdigest()==change['after'],name
              file.write_bytes(result)
          (Path(os.environ['PROOF'])/'verified-files.json').write_text(json.dumps({p:c['after'] for p,c in payload['files'].items()},indent=2))
          PY
      - name: Existing actual JavaScript regressions and repository checks
        run: |
          set -euo pipefail
          cd "$WORK"
          node --check apps/api/src/local_web/topic_map.js
          node scripts/test-topic-map-ui.cjs | tee "$PROOF/node.log"
          bash scripts/check-project-governance.sh 527b426e061c00c270bc9efbc6e916052ef12b4b | tee "$PROOF/governance.log"
          bash scripts/verify-ui-design-handbook.sh | tee "$PROOF/design.log"
          git diff --check
      - name: Install isolated browser for synthetic HTTP verification
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Actual browser interactions and readability measurements
        run: |
          set -euo pipefail
          cd "$WORK"
          python scripts/test-topic-map-compact-ui.py --output "$PROOF/browser" | tee "$PROOF/browser.log"
      - name: Publish only validated changes to this PR branch and remove temporary workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$WORK"
          python - <<'PY'
          import base64, json, os, subprocess
          from pathlib import Path
          proof=Path(os.environ['PROOF'])
          receipt=json.loads((proof/'browser/receipt.json').read_text())
          assert not receipt['pageErrors']
          summary='\n\n可阅读性修订自动回执：实际 JS VM 28 组回归通过；隔离 Chromium '+str(len(receipt['checks']))+' 组检查通过，含四宽度、小红书单平台、空平台不占位、真实混合记录保留、零/未知/极大数值、长标题和搜索统计分离；0 页面异常。文件治理和设计手册检查通过。代码与测试在本次推送前实际运行；合成 HTTP 不代表用户数据、Rust 运行服务、独立审查或业务验收。未合并或部署。运行记录：https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID']+' 。\n'
          for name in ['docs/design/changes/topic-map-compact-382.md','docs/progress/2026-10.md']:
              with Path(name).open('a') as f:f.write(summary)
          Path('.github/workflows/topic-map-compact-transfer.yml').unlink()
          allowed={'apps/api/src/local_web/topic_map.js','apps/api/src/local_web/topic_map.css','docs/design/changes/topic-map-compact-382.md','docs/design/lids/migration-log.md','docs/progress/2026-10.md','scripts/test-topic-map-ui.cjs','scripts/test-topic-map-compact-ui.py','.github/workflows/topic-map-compact-transfer.yml'}
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changed==allowed,changed
          subprocess.run(['bash','scripts/check-project-governance.sh','527b426e061c00c270bc9efbc6e916052ef12b4b'],check=True)
          subprocess.run(['git','diff','--check'],check=True)
          subprocess.run(['git','add','--',*sorted(allowed)],check=True)
          subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','fix(topic-map): readable XHS summary, scoped search and journey typography, Refs #382'],check=True)
          auth=base64.b64encode(('x-access-token:'+os.environ['GH_TOKEN']).encode()).decode()
          git=['git','-c','http.https://github.com/.extraheader=AUTHORIZATION: basic '+auth]
          url='https://github.com/'+os.environ['GITHUB_REPOSITORY']+'.git'
          ref='refs/heads/codex/topic-map-compact-382'
          current=subprocess.check_output(git+['ls-remote',url,ref],text=True).split()[0]
          assert current==os.environ['GITHUB_SHA'],'Branch moved; do not overwrite another change'
          subprocess.run(git+['push',url,'HEAD:'+ref],check=True)
          (proof/'published-head.txt').write_text(subprocess.check_output(['git','rev-parse','HEAD'],text=True))
          (proof/'final.patch').write_bytes(subprocess.check_output(['git','diff','527b426e061c00c270bc9efbc6e916052ef12b4b','HEAD','--',*sorted(allowed)]))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: topic-map-readability-proof
          path: ${{ runner.temp }}/topic-map-readability-proof
          retention-days: 7
          if-no-files-found: error
