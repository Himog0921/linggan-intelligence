<div id="topic-map-root" class="tm-root" data-view="overview" aria-label="主题图谱">

  <aside class="tm-tree" aria-label="主题结构">
    <div class="tm-tree-head">
      <div class="tm-kicker"><strong>TOPIC MAP</strong><span id="treeTotal">主题结构</span></div>
      <label class="tm-find">
        <span data-icon="Search" data-size="14"></span>
        <input id="treeSearch" type="search" placeholder="查找主题" autocomplete="off" aria-label="查找主题">
        <button class="icon-btn" id="treeClear" type="button" aria-label="清空查找" hidden><span data-icon="X" data-size="12"></span></button>
      </label>
    </div>
    <nav class="tm-tree-scroll" id="treeScroll" aria-label="主题目录"></nav>
    <div class="tm-tree-foot">
      <button class="tm-unassigned" id="unassigned" type="button" data-topic="__unassigned">
        <span>尚未归类材料</span><b>3,242</b>
        <small>未归入任何主题的观察材料</small>
      </button>
    </div>
  </aside>

  <main class="tm-main" id="main" tabindex="-1" aria-labelledby="currentTitle">
    <div class="tm-main-inner">

      <header class="tm-pagehead">
        <div class="tm-title">
          <div class="path" id="currentPath" hidden></div>
          <h1 id="currentTitle">全部方向</h1>
          <p id="currentMeta"></p>
        </div>
        <div class="tm-head-controls">
          <div class="tm-scope" role="group" aria-label="统计范围">
            <label>平台
              <select id="platformFilter"><option>全部平台</option><option>小红书</option><option>抖音</option></select>
            </label>
            <label>时间
              <select id="timeFilter"><option>全部时间</option><option>近 7 天</option><option>近 30 天</option><option>近 90 天</option></select>
            </label>
          </div>
          <div class="tm-viewswitch" role="group" aria-label="主题图谱视图">
            <button type="button" data-view="overview" aria-pressed="true">主题概览</button>
            <button type="button" data-view="journey" aria-pressed="false">用户生命旅程</button>
          </div>
        </div>
      </header>

      <!-- ============ 主题概览 ============ -->
      <section id="overviewPanel" aria-label="主题概览">
        <div class="tm-overview" aria-label="主题统计与样本表现">
          <div class="tm-metrics" id="metrics"></div>
          <div class="tm-dist">
            <div class="tm-dist-head">
              <h2>样本表现<small>小红书 · 点赞分布</small></h2>
              <div class="tm-dist-tools">
                <div class="tm-legend"><span><i></i>常规</span><span><i class="signal"></i>达到已设高表现规则</span></div>
                <div class="tm-mini-tabs" role="group" aria-label="分布呈现方式">
                  <button type="button" data-chart="bars" aria-pressed="true">图表</button>
                  <button type="button" data-chart="table" aria-pressed="false">表格</button>
                </div>
              </div>
            </div>
            <div id="distBody"></div>
          </div>
        </div>

        <nav class="tm-worknav" aria-label="主题分析视图">
          <div class="tm-tabs" role="tablist" id="workTabs">
            <button type="button" role="tab" data-tab="materials" aria-selected="true">材料与讨论</button>
            <button type="button" role="tab" data-tab="structure" aria-selected="false">结构与表现</button>
            <button type="button" role="tab" data-tab="patterns" aria-selected="false">内容格局</button>
            <button type="button" role="tab" data-tab="sources" aria-selected="false">来源分布</button>
            <button type="button" role="tab" data-tab="candidates" aria-selected="false">新方向<span class="num">5</span></button>
            <button type="button" role="tab" data-tab="own" aria-selected="false">我方对照与再做</button>
          </div>
          <div class="tm-worknav-side">
            <button class="text-action light" id="matrixButton" type="button">主题 × 旅程<span data-icon="ArrowUpRight" data-size="12"></span></button>
          </div>
        </nav>

        <section class="tm-work" role="tabpanel" aria-labelledby="sectionTitle">
          <div class="tm-work-head">
            <div class="tm-work-title"><h2 id="sectionTitle">材料与讨论</h2><p id="sectionCount"></p></div>
            <div class="tm-tools" id="materialTools">
              <label class="tm-search"><span data-icon="Search" data-size="14"></span><input id="materialSearch" type="search" placeholder="查找标题、作者或正文" aria-label="查找材料"></label>
              <div class="tm-seg" role="group" aria-label="材料排序与筛选">
                <button type="button" data-filter="latest" aria-pressed="true">最新作品</button>
                <button type="button" data-filter="high" aria-pressed="false">高表现</button>
                <button type="button" data-filter="ordinary" aria-pressed="false">常规作品</button>
              </div>
            </div>
          </div>
          <div id="tabContent"></div>
        </section>
      </section>

      <!-- ============ 用户生命旅程 ============ -->
      <section id="journeyPanel" class="tm-journey" aria-label="用户生命旅程" hidden>
        <div class="tm-journey-head">
          <div>
            <h2>用户经历的五个主要阶段</h2>
            <p>基于 <b>3,267</b> 篇可读作品 · 选择阶段查看具体场景</p>
          </div>
          <div class="tm-tools">
            <div class="tm-seg" role="group" aria-label="阶段统计口径">
              <button type="button" data-jmetric="main" aria-pressed="true">主阶段分布</button>
              <button type="button" data-jmetric="involved" aria-pressed="false">阶段涉及率</button>
            </div>
            <div class="tm-mini-tabs" role="group" aria-label="旅程呈现方式">
              <button type="button" data-jdisplay="map" aria-pressed="true">地图</button>
              <button type="button" data-jdisplay="list" aria-pressed="false">列表</button>
            </div>
          </div>
        </div>
        <div id="stageArea"></div>
        <div class="tm-scene-head"><h3 id="sceneHeading">发现与理解<small>具体场景</small></h3><span class="tm-table-note" id="sceneCount"></span></div>
        <div class="tm-scenes" id="sceneGrid"></div>
      </section>

    </div>
  </main>
</div>

<div class="tm-scrim" id="scrim"></div>
<aside class="tm-inspector" id="inspector" aria-label="材料详情" aria-hidden="true">
  <div class="tm-insp-head">
    <div>
      <div class="tm-insp-kicker"><strong>EVIDENCE</strong><span id="inspKind">原文与讨论</span></div>
      <h2 id="inspTitle">材料详情</h2>
    </div>
    <button class="icon-btn" id="inspClose" type="button" aria-label="关闭详情"><span data-icon="X" data-size="16"></span></button>
  </div>
  <div class="tm-insp-body" id="inspBody"></div>
  <div class="tm-insp-actions">
    <button class="btn primary small" type="button" id="inspLocate">定位原始材料</button>
    <button class="btn small" type="button" id="inspCancel">返回列表</button>
  </div>
</aside>
<div class="tm-toast" id="toast" role="status" aria-live="polite"></div>
