<style>
/* src/styles/lids_tokens.css */
/* 创作工作台作用域：只在 .gm-studio 内把焦点色与 info 色换成 demo 的墨黑，写稿区的警告圆点用更深的警告色；全站值不变。 */
.gm-studio{--lgi-focus:var(--lgi-studio-focus);--lgi-info:var(--lgi-studio-info)}
.gm-studio .write{--lgi-warning-dot:var(--lgi-warning)}

[data-theme="linggan-intelligence"] {
  /* Canvas */
  --lgi-canvas: #ffffff;
  --lgi-canvas-hi: #ffffff;
  --lgi-canvas-low: #f7f8f8;
  --lgi-canvas-sunken: #eef0f1;
  --lgi-canvas-overlay: rgba(255, 255, 255, 0.94);
  --lgi-canvas-glass: rgba(255, 255, 255, 0.88);

  /* Ink */
  --lgi-on-dark: #ffffff;

  /* Signature signal */
  /* Shared keyboard focus ring; distinct from the product signal state. */
  --lgi-focus: #335e72;

  /* Semantic: five axes, each carries text / fill / soft.
   * Fill values stay saturated for the badge mark (the small square); text values are darkened
   * so they clear 4.5:1 on the white canvas. Never swap the two roles. */
  --lgi-success-dot: #0e9e6e;
  --lgi-success-soft: rgba(14, 158, 110, 0.10);
  --lgi-warning-dot: #eaaa05;
  --lgi-warning-soft: rgba(234, 170, 5, 0.12);
  --lgi-danger-dot: #a42001;
  --lgi-danger-soft: rgba(164, 32, 1, 0.08);
  --lgi-info-dot: #8d9a9d;
  --lgi-info-soft: rgba(141, 154, 157, 0.14);
  --lgi-unknown-dot: #c3c8cb;
  --lgi-unknown-soft: #e7eaeb;

  /* Badge (Mog 2026-11-27, replaces the solid-fill tag rule in primitives.md):
   * coloured text + a leading square mark; no fill, no frame. Square = the role's *-dot (fill)
   * colour, text = the role's text colour. Neutral categories use body for both. */
  --lgi-badge-mark: 6px;
  --lgi-badge-gap: 6px;
  --lgi-badge-size: var(--lgi-type-label-size);
  --lgi-badge-weight: var(--lgi-weight-medium);

  /* Borders */

  /* Instrument mesh: a measurement field, not decoration. Dots read lighter than
   * a ruled grid at the same weight, so the surface stays quiet while gaining depth. */

  /* Observation stream: the one deliberately dark surface in the product. Mog approved
   * keeping the V4 Gold Master's low-luminance instrument terminal on 2026-08-26; it is a
   * recorded long-term exception to the LIDS rule against dark terminal surfaces, and it is
   * confined to Operations/NOW. Never reuse these outside that stream. */
  --lgi-stream-bg: #07110e;
  --lgi-stream-bg-raised: #091712;
  --lgi-stream-ink: #d9f7e8;
  --lgi-stream-muted: #78aa97;
  --lgi-stream-dim: #42685a;
  --lgi-stream-mint: #63d9a5;
  --lgi-stream-cyan: #74b8ad;
  --lgi-stream-amber: #d59a38;
  --lgi-stream-red: #e06a55;
  --lgi-stream-line: rgba(99, 217, 165, 0.2);

  /* V8 action family: opt-in only; existing page tokens retain their values. */
  --lgi-action-sunken: #f5f7f8;
  --lgi-action-border: #c6ced3;
  --lgi-action-danger-soft: #fff0ed;
  --lgi-action-lattice-danger: repeating-conic-gradient(rgba(181,43,32,.2) 0% 25%,transparent 0% 50%);
  --lgi-action-lattice-dim: repeating-conic-gradient(rgba(11,15,18,.07) 0% 25%,transparent 0% 50%);
  --lgi-action-mask: linear-gradient(90deg,#0000 0 8%,#00000026 8% 22%,#0000004d 22% 36%,#00000073 36% 50%,#0000009e 50% 64%,#000000c4 64% 78%,#000000e8 78% 90%,#000 90% 100%);
  --lgi-action-quiet-ruler: repeating-linear-gradient(90deg,var(--lgi-action-mark) 0 8px,transparent 8px 10px);
  --lgi-action-height: 40px;
  --lgi-action-quiet-height: 28px;
  --lgi-action-gap: 4px;
  --lgi-action-padding: 16px;
  --lgi-action-quiet-padding: 2px;
  --lgi-action-border-width: 1px;
  --lgi-action-rail-width: 2px;
  --lgi-action-lattice-hover: 40%;
  --lgi-action-lattice-active: 100%;
  --lgi-action-focus-offset: 2px;
  --lgi-action-focus-gap-width: 3px;
  --lgi-action-focus-idle-gap: 5px;
  --lgi-action-focus-idle-ring: 7px;
  --lgi-action-focus-hover-offset: 3px;
  --lgi-action-focus-hover-gap: 6px;
  --lgi-action-focus-hover-ring: 8px;
  --lgi-action-cell-size: 6px;
  --lgi-action-cell-gap: 2px;
  --lgi-action-cell-dim: .25;
  --lgi-action-motion-instant: 90ms;
  --lgi-action-motion-fast: 140ms;
  --lgi-action-motion-cycle: 800ms;
  --lgi-action-motion-step: 200ms;
  --lgi-action-ease: cubic-bezier(.2,.78,.2,1);

  /* Scope bar (Mog 2026-11-27): several C17 SelectField triggers sharing one ink frame, e.g.
   * 平台 / 时间 above a page. Each segment = muted field name + ink value + chevron; segments are
   * divided by an ink rule inside the frame; the M2 lattice tail appears once, at the far end. */
  --lgi-scope-height: var(--lgi-action-height);
  --lgi-scope-frame: var(--lgi-action-border-width) solid var(--lgi-ink);
  --lgi-scope-divider: var(--lgi-action-border-width) solid var(--lgi-ink);
  --lgi-scope-pad: var(--lgi-space-3);
  --lgi-scope-label: var(--lgi-muted);
  --lgi-scope-value: var(--lgi-ink);
  --lgi-scope-open: var(--lgi-focus-warm);
  --lgi-scope-tail: var(--lgi-secondary-tail);

  /* Approved V3 reading material surfaces, scoped to the content workbench. */
  --lgi-reading-paper: #faf7ee;
  --lgi-reading-edge: #e6ddca;
  --lgi-reading-ink: #37352e;
  --lgi-reading-selected: #f5e3a0;
  --lgi-reading-cover: #7c5042;

  /* Typography */
  /* Three type roles, three jobs. Sans states what the system knows; mono carries the things a
   * machine assigned — refs, counts, timestamps, state codes; serif is reserved for material
   * quoted verbatim out of a source. A reader must be able to tell someone's own sentence from
   * the system's description of it without reading either, so serif is never used for chrome. */

  /* Applied to the right edge of a solid Ink action or an active plate, under a fade mask, so
   * the mark reads as an instrument surface rather than as decoration. It must never sit under
   * a label: mask the fade so the texture starts after the text ends. */
  --lgi-mosaic-on-dark: conic-gradient(from 90deg, rgba(255, 255, 255, 0.22) 25%, transparent 0 50%, rgba(255, 255, 255, 0.22) 0 75%, transparent 0);
  --lgi-mosaic-on-light: conic-gradient(from 90deg, rgba(17, 19, 21, 0.13) 25%, transparent 0 50%, rgba(17, 19, 21, 0.13) 0 75%, transparent 0);
  --lgi-weight-regular: 400;
  --lgi-weight-medium: 500;
  --lgi-weight-semibold: 600;
  --lgi-ls-tight: -0.04em;
  --lgi-ls-normal: 0;
  --lgi-ls-data: 0.04em;
  --lgi-ls-caps: 0.12em;
  --lgi-ls-calibration: 0.18em;

  /* Spacing */
  --lgi-space-1: 4px;
  --lgi-space-2: 8px;
  --lgi-space-3: 12px;
  --lgi-space-4: 16px;
  --lgi-space-5: 20px;
  --lgi-space-6: 24px;
  --lgi-space-8: 32px;
  --lgi-space-10: 40px;
  --lgi-space-12: 48px;
  --lgi-space-16: 64px;
  --lgi-space-24: 96px;

  /* Radius */
  --lgi-radius-none: 0;
  --lgi-radius-xs: 2px;
  --lgi-radius-sm: 4px;
  --lgi-radius-md: 8px;

  /* Shadows */
  --lgi-shadow-none: none;
  --lgi-shadow-contact: 0 1px 2px rgba(17, 19, 21, 0.07);
  --lgi-shadow-overlay: 0 12px 30px rgba(17, 19, 21, 0.11);
  --lgi-shadow-stage: 0 24px 25px rgba(17, 19, 21, 0.05);
  --lgi-shadow-hard: 8px 8px 0 rgba(17, 19, 21, 0.07);

  /* Layout */
  --lgi-page-max-l3: 1720px;
  --lgi-page-max-workbench: 1440px;
  --lgi-header-height: 64px;
  --lgi-header-height-compact: 58px;
  --lgi-command-height: 76px;
  --lgi-grid-major: 180px;
  --lgi-grid-mobile: 120px;
  --lgi-calibration-width: 27px;

  /* Motion */
  --lgi-duration-press: 100ms;
  --lgi-duration-state: 160ms;
  --lgi-duration-overlay: 200ms;
  --lgi-duration-panel: 240ms;
  --lgi-duration-page: 280ms;
  --lgi-duration-scene: 600ms;
  --lgi-duration-ambient: 10s;
  --lgi-ease-ui: cubic-bezier(0.2, 0.75, 0.2, 1);
  --lgi-ease-enter: cubic-bezier(0.16, 1, 0.3, 1);
  --lgi-ease-linear: linear;

  /* Z-index */
  --lgi-z-base: 0;
  --lgi-z-stage: 10;
  --lgi-z-sticky: 30;
  --lgi-z-header: 40;
  --lgi-z-drawer: 80;

  /* 深色表面上的白色透明层 */

  --lgi-studio-on-dark-wash: #ffffff24;
  --lgi-studio-on-dark-14: rgba(255,255,255,.14);

  /* 遮罩 */

  /* 手机预览 */
  --lgi-studio-phone-ink: #222;

  /* 评论研究（B-04 对齐稿 apps/web/design-reference/comment-research-b04.html）：稿内有、LIDS 尚未登记的取值。Mog 2026-11-23 确认稿件。 */

  --lgi-cr-metric-col: 296px;            /* 概览左列读数宽度 */

.tm-dist-table td{color:var(--lgi-ink);font-weight:var(--lgi-weight-semibold)}
.tm-dist-table td.high{color:var(--lgi-signal-ink)}
.tm-dist-table :is(th,td):first-child{text-align:left;font-family:var(--lgi-font-ui);color:var(--lgi-muted);font-weight:var(--lgi-weight-regular)}
.tm-chart .empty{grid-row:span 2;align-self:center;padding:0}

/* ---------- 工作区导航 ---------- */
.tm-worknav{position:sticky;top:0;z-index:var(--lgi-z-sticky);display:flex;align-items:stretch;justify-content:space-between;gap:var(--lgi-space-5);background:var(--lgi-canvas);border-top:var(--lgi-action-rail-width) solid var(--lgi-ink);border-bottom:var(--lgi-action-rail-width) solid var(--lgi-ink)}
.tm-tabs{display:flex;align-items:stretch;gap:var(--lgi-space-6);min-width:0;overflow-x:auto;scrollbar-width:none}
.tm-tabs::-webkit-scrollbar{display:none}
.tm-tabs button{position:relative;flex:none;min-height:calc(var(--lgi-space-12) + var(--lgi-space-2));border:0;background:transparent;padding:0;color:var(--lgi-muted);font:var(--lgi-type-control-weight) var(--lgi-type-data-size)/var(--lgi-type-control-leading) var(--lgi-font-ui);white-space:nowrap}
.tm-tabs button:hover{color:var(--lgi-ink)}
.tm-tabs button[aria-selected=true]{color:var(--lgi-ink);font-weight:var(--lgi-weight-semibold)}
.tm-tabs button[aria-selected=true]::after{content:"";position:absolute;inset:auto 0 calc(-1 * var(--lgi-action-rail-width));height:calc(var(--lgi-action-rail-width) * 2);background:var(--lgi-signal-mark)}
.tm-tabs button .num{margin-left:var(--lgi-space-1);font-size:var(--lgi-type-aux-size);color:var(--lgi-meta);font-weight:var(--lgi-weight-regular)}
.tm-worknav-side{display:flex;align-items:center;gap:var(--lgi-space-5);flex:none;padding-left:var(--lgi-space-4)}
.tm-navtools{display:flex;align-items:center;gap:var(--lgi-space-4)}
.tm-navtools .find{width:240px}
.tm-navtools .vs{border-bottom-color:transparent}
.tm-navtools+.text-action{position:relative;margin-left:var(--lgi-space-1);padding-left:0}
.tm-worknav-side .sep{align-self:center;width:var(--lgi-action-border-width);height:var(--lgi-space-6);background:var(--lgi-ink)}

/* ---------- 工作区 ---------- */
.tm-work{padding-top:var(--lgi-space-2)}
.tm-tools{display:flex;align-items:flex-end;gap:var(--lgi-space-5);min-width:0}

/* 材料：台账式行，数字列对齐；行间只用留白 */
.tm-list-head,.tm-row{display:grid;grid-template-columns:var(--lgi-tm-cover-w) minmax(0,1fr) repeat(4,var(--lgi-tm-stat-col)) var(--lgi-tm-action-col);column-gap:var(--lgi-space-4);align-items:center}
.tm-list-head{height:var(--lgi-space-8);border-bottom:var(--lgi-action-border-width) solid var(--lgi-ink);font-size:var(--lgi-type-aux-size);color:var(--lgi-muted)}
.tm-list-head span:nth-child(n+3){text-align:right}
.tm-row{padding:var(--lgi-space-3) 0;transition:background var(--lgi-duration-state) var(--lgi-ease-ui)}
.tm-row:hover{background:var(--lgi-canvas-low)}
.tm-cover{width:var(--lgi-tm-cover-w);height:var(--lgi-tm-cover-h);border:1px solid var(--lgi-border);background:var(--lgi-canvas);display:grid;place-items:center;color:var(--lgi-ghost);font-size:var(--lgi-type-aux-size);line-height:1.35;text-align:center}
.tm-row-main{min-width:0;display:grid;gap:2px}
.tm-row-title{margin:0;font:var(--lgi-weight-semibold) var(--lgi-type-body-size)/1.5 var(--lgi-font-ui);color:var(--lgi-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm-row-title button{all:unset;cursor:pointer}
.tm-row-title button:hover{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px}
.tm-row-title button:focus-visible{outline:var(--lgi-focus-inset) solid var(--lgi-focus);outline-offset:var(--lgi-action-focus-offset)}
.tm-row-meta{display:flex;align-items:center;gap:var(--lgi-space-4);min-width:0;font-size:var(--lgi-type-label-size);color:var(--lgi-muted);white-space:nowrap}
.tm-row-meta .who{overflow:hidden;text-overflow:ellipsis}
.tm-row-excerpt{margin:0;font:var(--lgi-type-body-weight) var(--lgi-type-label-size)/1.6 var(--lgi-font-evidence);color:var(--lgi-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm-stat{text-align:right;font:var(--lgi-weight-semibold) var(--lgi-type-data-size)/1 var(--lgi-font-data);color:var(--lgi-ink);font-variant-numeric:tabular-nums}
.tm-stat.unknown{color:var(--lgi-ghost);font-weight:var(--lgi-weight-regular)}
.tm-stat.high{color:var(--lgi-signal-ink)}
.tm-row-actions{display:flex;align-items:center;justify-content:flex-end;gap:var(--lgi-space-4)}
.tm-list-foot{display:flex;justify-content:space-between;align-items:center;padding:var(--lgi-space-3) 0;border-top:var(--lgi-action-border-width) solid var(--lgi-ink);font-size:var(--lgi-type-aux-size);color:var(--lgi-meta)}

/* 台账表：表头墨线，行用斑马底，不画行线 */
.tm-table{width:100%;border-collapse:collapse;font-size:var(--lgi-type-label-size)}
.tm-table th{height:var(--lgi-space-8);padding:0 var(--lgi-space-3);text-align:left;font-weight:var(--lgi-weight-regular);font-size:var(--lgi-type-aux-size);color:var(--lgi-muted);border-bottom:var(--lgi-action-border-width) solid var(--lgi-ink);white-space:nowrap}
.tm-table td{height:var(--lgi-ledger-row);padding:0 var(--lgi-space-3);color:var(--lgi-body);vertical-align:middle}
.tm-table tbody tr:nth-child(even) td{background:var(--lgi-canvas-low)}
.tm-table tbody tr:hover td{background:var(--lgi-canvas-sunken)}
.tm-table tbody tr.is-active td{background:var(--lgi-focus-warm)}
.tm-table tbody tr.is-active td:first-child{box-shadow:inset var(--lgi-action-rail-width) 0 var(--lgi-signal)}
.tm-table .r{text-align:right}
.tm-table .n{font-family:var(--lgi-font-data);font-variant-numeric:tabular-nums;color:var(--lgi-ink)}
.tm-table .strong{font-weight:var(--lgi-weight-semibold);color:var(--lgi-ink)}
.tm-table .muted{color:var(--lgi-ghost)}
.tm-meter{display:inline-flex;align-items:center;gap:var(--lgi-space-2)}
.tm-meter i{display:block;width:96px;height:var(--lgi-space-1);background:var(--lgi-canvas-sunken);position:relative}
.tm-meter i::after{content:"";position:absolute;inset:0 auto 0 0;width:var(--w);background:var(--lgi-ink)}
.tm-note{margin:var(--lgi-space-3) 0 0;font-size:var(--lgi-type-aux-size);color:var(--lgi-meta)}

/* 内容格局 */
.tm-patterns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 var(--lgi-space-10)}
.tm-pattern h3{padding-bottom:var(--lgi-space-2);margin-bottom:var(--lgi-space-2);border-bottom:var(--lgi-action-border-width) solid var(--lgi-ink);font:var(--lgi-weight-semibold) var(--lgi-type-body-size)/1.5 var(--lgi-font-ui)}
.tm-pattern-row{display:grid;grid-template-columns:96px minmax(0,1fr) 32px;align-items:center;gap:var(--lgi-space-3);height:var(--lgi-space-8);font-size:var(--lgi-type-label-size)}
.tm-pattern-row b{text-align:right;font:var(--lgi-weight-semibold) var(--lgi-type-label-size) var(--lgi-font-data);color:var(--lgi-ink);font-variant-numeric:tabular-nums}
.tm-pattern-row i{display:block;height:var(--lgi-space-2);width:var(--w);background:var(--lgi-body)}
.tm-pattern-row:nth-of-type(1) i{background:var(--lgi-ink)}

/* 新方向 */
.tm-candidates{border-top:var(--lgi-action-border-width) solid var(--lgi-ink)}
.tm-candidate{display:grid;grid-template-columns:var(--lgi-space-8) minmax(0,1fr) 96px auto;align-items:center;gap:var(--lgi-space-4);min-height:calc(var(--lgi-space-12) + var(--lgi-space-2))}
.tm-candidate:nth-child(even){background:var(--lgi-canvas-low)}
.tm-candidate .idx{padding-left:var(--lgi-space-2);font:var(--lgi-weight-medium) var(--lgi-type-aux-size) var(--lgi-font-data);color:var(--lgi-ghost)}
.tm-candidate strong{display:block;font:var(--lgi-weight-semibold) var(--lgi-type-body-size)/1.5 var(--lgi-font-ui);color:var(--lgi-ink)}
.tm-candidate small{font-size:var(--lgi-type-aux-size);color:var(--lgi-muted)}
.tm-candidate .btn{margin-right:var(--lgi-space-2)}

/* ---------- 用户生命旅程 ---------- */
.tm-journey{padding-top:var(--lgi-space-4)}
.tm-journey-head{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--lgi-space-5);padding-bottom:var(--lgi-space-4)}
.tm-journey-head p{margin:0;padding-bottom:var(--lgi-space-2);font-size:var(--lgi-type-label-size);color:var(--lgi-muted)}
.tm-journey-head p b{font:var(--lgi-weight-semibold) var(--lgi-type-label-size) var(--lgi-font-data);color:var(--lgi-ink)}
.tm-stages{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:var(--lgi-space-6);border-top:var(--lgi-action-rail-width) solid var(--lgi-ink)}
.tm-stage{position:relative;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:var(--lgi-space-1);padding:var(--lgi-space-4) var(--lgi-space-3);border:0;background:transparent;text-align:left;color:var(--lgi-body)}
.tm-stage:hover,.tm-stage[aria-pressed=true]{background:var(--lgi-canvas-low)}
.tm-stage[aria-pressed=true]::before{content:"";position:absolute;inset:calc(-1 * var(--lgi-action-rail-width)) 0 auto;height:calc(var(--lgi-action-rail-width) * 2);background:var(--lgi-signal-mark)}
.tm-stage .idx{font:var(--lgi-weight-semibold) var(--lgi-type-aux-size)/1 var(--lgi-font-data);letter-spacing:var(--lgi-ls-data);color:var(--lgi-meta)}
.tm-stage[aria-pressed=true] .idx{color:var(--lgi-signal-ink)}
.tm-stage .name{margin-top:var(--lgi-space-1);font:var(--lgi-weight-semibold) var(--lgi-type-body-size)/1.4 var(--lgi-font-ui);color:var(--lgi-ink)}
.tm-stage .q{font-size:var(--lgi-type-label-size);color:var(--lgi-muted);min-height:3em}
.tm-stage .val{margin-top:var(--lgi-space-2);font:var(--lgi-type-metric-weight) var(--lgi-type-metric-size)/1 var(--lgi-font-data);color:var(--lgi-ink);font-variant-numeric:tabular-nums}
.tm-stage .val small{margin-left:var(--lgi-space-1);font:var(--lgi-weight-regular) var(--lgi-type-label-size) var(--lgi-font-ui);color:var(--lgi-muted)}
.tm-stage .rel{width:100%;height:var(--lgi-space-1);margin-top:var(--lgi-space-2);background:var(--lgi-canvas-sunken);position:relative}
.tm-stage .rel::after{content:"";position:absolute;inset:0 auto 0 0;width:var(--w);background:var(--lgi-ink)}
.tm-stage[aria-pressed=true] .rel::after{background:var(--lgi-signal)}
.tm-stage-note{margin:var(--lgi-space-2) 0 0;font-size:var(--lgi-type-aux-size);color:var(--lgi-meta);text-align:right}
.tm-scene-head{display:flex;align-items:baseline;justify-content:space-between;gap:var(--lgi-space-3);margin:var(--lgi-space-8) 0 var(--lgi-space-2);padding-bottom:var(--lgi-space-2);border-bottom:var(--lgi-action-border-width) solid var(--lgi-ink)}
.tm-scene-head h3{font:var(--lgi-weight-semibold) var(--lgi-type-reading-size)/1.5 var(--lgi-font-ui)}
.tm-scene-head h3 small{margin-left:var(--lgi-space-2);font:var(--lgi-weight-regular) var(--lgi-type-label-size) var(--lgi-font-ui);color:var(--lgi-muted)}
.tm-scene-head span{font-size:var(--lgi-type-aux-size);color:var(--lgi-meta)}
.tm-scenes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--lgi-space-2) var(--lgi-space-10)}
.tm-scene{min-width:0;padding:var(--lgi-space-4) 0;display:flex;flex-direction:column;gap:var(--lgi-space-2)}
.tm-scene h4{font:var(--lgi-weight-semibold) var(--lgi-type-body-size)/1.55 var(--lgi-font-ui)}
.tm-scene .meta{font-size:var(--lgi-type-aux-size);color:var(--lgi-meta)}
.tm-scene blockquote{margin:0;padding:var(--lgi-space-1) 0 var(--lgi-space-1) var(--lgi-space-3);border-left:var(--lgi-action-rail-width) solid var(--lgi-ink);font:var(--lgi-type-body-weight) var(--lgi-type-body-size)/var(--lgi-type-body-leading) var(--lgi-font-evidence);color:var(--lgi-ink)}
.tm-scene .foot{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--lgi-space-4)}
.tm-scene .foot span{font-size:var(--lgi-type-label-size);color:var(--lgi-muted)}

/* ---------- 检查器 ---------- */
.tm-scrim{position:fixed;inset:0;z-index:var(--lgi-z-overlay);background:color-mix(in srgb,var(--lgi-ink) 24%,transparent);opacity:0;pointer-events:none;transition:opacity var(--lgi-duration-panel) var(--lgi-ease-ui)}
.tm-scrim.open{opacity:1;pointer-events:auto}
.tm-inspector{position:fixed;z-index:calc(var(--lgi-z-overlay) + 1);top:0;right:0;bottom:0;width:min(var(--lgi-tm-inspector-width),94vw);display:flex;flex-direction:column;background:var(--lgi-canvas);border-left:var(--lgi-action-rail-width) solid var(--lgi-ink);box-shadow:var(--lgi-tm-inspector-shadow);transform:translateX(104%);transition:transform var(--lgi-duration-panel) var(--lgi-ease-enter);color:var(--lgi-body);font:var(--lgi-type-body-weight) var(--lgi-type-body-size)/var(--lgi-type-body-leading) var(--lgi-font-ui)}
.tm-inspector.open{transform:none}
.tm-insp-head{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--lgi-space-4);padding:var(--lgi-space-5) var(--lgi-space-6) var(--lgi-space-4);border-bottom:var(--lgi-action-rail-width) solid var(--lgi-ink)}
.tm-insp-kicker{display:flex;gap:var(--lgi-space-2);align-items:baseline;font-size:var(--lgi-type-aux-size);color:var(--lgi-muted)}
.tm-insp-kicker strong{font:var(--lgi-weight-semibold) var(--lgi-type-aux-size)/1 var(--lgi-font-english);letter-spacing:var(--lgi-ls-caps);color:var(--lgi-signal)}
.tm-insp-head h2{margin:var(--lgi-space-2) 0 0;font:var(--lgi-type-object-weight) var(--lgi-type-section-size)/var(--lgi-type-object-leading) var(--lgi-font-ui);color:var(--lgi-ink)}
.tm-insp-body{flex:1;overflow:auto;padding:var(--lgi-space-5) var(--lgi-space-6) var(--lgi-space-8)}
.tm-insp-sec{margin-bottom:var(--lgi-space-6)}
.tm-insp-sec h3{margin:0 0 var(--lgi-space-2);font:var(--lgi-weight-semibold) var(--lgi-type-label-size)/1.5 var(--lgi-font-ui);color:var(--lgi-muted)}
.tm-insp-sec p{margin:0}
.tm-insp-quote{margin:0;padding:var(--lgi-space-1) 0 var(--lgi-space-1) var(--lgi-space-4);border-left:var(--lgi-action-rail-width) solid var(--lgi-signal);font:var(--lgi-type-reading-weight) var(--lgi-type-reading-size)/var(--lgi-type-reading-leading) var(--lgi-font-evidence);color:var(--lgi-ink)}
.tm-insp-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--lgi-space-4) var(--lgi-space-5)}
.tm-insp-grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.tm-insp-grid span{display:block;font-size:var(--lgi-type-aux-size);color:var(--lgi-meta)}
.tm-insp-grid strong{font:var(--lgi-weight-semibold) var(--lgi-type-control-size)/1.5 var(--lgi-font-ui);color:var(--lgi-ink)}
.tm-insp-grid strong.n{font:var(--lgi-type-metric-weight) var(--lgi-type-section-size)/1.3 var(--lgi-font-data)}
.tm-insp-grid strong.unknown{color:var(--lgi-ghost);font-weight:var(--lgi-weight-regular)}
.tm-insp-actions{display:flex;gap:var(--lgi-space-3);padding:var(--lgi-space-4) var(--lgi-space-6);border-top:var(--lgi-action-rail-width) solid var(--lgi-ink)}

/* ---------- 反馈 ---------- */
.tm-toast{position:fixed;left:50%;bottom:var(--lgi-space-6);z-index:var(--lgi-z-toast);transform:translate(-50%,var(--lgi-space-3));opacity:0;pointer-events:none;display:flex;align-items:center;gap:var(--lgi-space-2);padding:var(--lgi-space-2) var(--lgi-space-4);background:var(--lgi-ink);color:var(--lgi-on-dark);font:var(--lgi-type-label-weight) var(--lgi-type-label-size)/1.5 var(--lgi-font-ui);box-shadow:var(--lgi-shadow-overlay);transition:opacity var(--lgi-duration-state) var(--lgi-ease-ui),transform var(--lgi-duration-state) var(--lgi-ease-ui)}
.tm-toast.show{opacity:1;transform:translate(-50%,0)}
.tm-toast::before{content:"";width:6px;height:6px;background:var(--lgi-signal-mark)}

/* ---------- 响应式 ---------- */
@media (max-width:1360px){
  .tm-worknav{flex-wrap:wrap;row-gap:0}
  .tm-tabs{flex:1 1 100%}
  .tm-worknav-side{flex:1 1 100%;justify-content:flex-end;padding:var(--lgi-space-2) 0}
  .tm-tabs button[aria-selected=true]::after{bottom:0}
  .tm-data{grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:auto auto 0 auto var(--lgi-tm-bars-height) auto}
  .tm-chart{grid-column:1 / -1;grid-row:4 / span 3;margin-top:var(--lgi-space-2)}
  .tm-list-head,.tm-row{grid-template-columns:var(--lgi-tm-cover-w) minmax(0,1fr) repeat(4,44px) var(--lgi-tm-action-col)}
}
@media (max-width:1100px){
  .tm-main{padding:0 var(--lgi-space-6) var(--lgi-space-10)}
  .tm-pagehead{flex-wrap:wrap}
  .tm-head-controls{width:100%;justify-content:space-between}
  .tm-data{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:auto auto auto auto auto auto auto var(--lgi-tm-bars-height) auto}
  .tm-readout:nth-child(n+3){margin-top:var(--lgi-space-4)}
  .tm-chart{grid-row:7 / span 3}
  .tm-worknav-side{padding-left:0}
  .tm-navtools .find{width:200px}
  .tm-list-head{display:none}
  .tm-row{grid-template-columns:var(--lgi-tm-cover-w) minmax(0,1fr) auto}
  .tm-row .tm-stat{display:none}
  .tm-stages{grid-template-columns:repeat(3,minmax(0,1fr))}
  .tm-patterns{grid-template-columns:minmax(0,1fr);gap:var(--lgi-space-6)}
}
@media (max-width:820px){
  .topic-map-app{height:auto;overflow:visible}
  .tm-root{grid-template-columns:minmax(0,1fr)}
  .tm-tree{border-right:0;border-bottom:var(--lgi-action-rail-width) solid var(--lgi-ink);max-height:360px}
  .tm-main{overflow:visible;padding:0 var(--lgi-space-4) var(--lgi-space-10)}
  .tm-row{grid-template-columns:var(--lgi-tm-cover-w) minmax(0,1fr)}
  .tm-row-actions{grid-column:2;justify-content:flex-start}
  .tm-scenes,.tm-stages{grid-template-columns:minmax(0,1fr)}
  .tm-candidate{grid-template-columns:minmax(0,1fr) auto}
  .tm-candidate .idx{display:none}
}
@media (prefers-reduced-motion:reduce){
  .tm-inspector,.tm-scrim,.tm-toast,.btn,.tm-bar .bb,.scope-trigger .lgi-icon{transition:none}
}

</style>
</head>

  let openSel = null, active = 0;

    const key = btn.dataset.select, cfg = SELECTS[key], menu = $('selectMenu');

    menu.style.minWidth = r.width + 'px';

    menu.style.left = Math.min(r.left, window.innerWidth - menu.offsetWidth - 12) + 'px';
  }
  function paintMenu() {
    const cfg = SELECTS[openSel.dataset.select];
    $('selectMenu').setAttribute('aria-label', cfg.label);
    $('selectMenu').innerHTML = cfg.options.map((o, i) => '<div role="option" data-opt="' + i + '" aria-selected="' + (o === cfg.value) + '"' + (i === active ? ' data-active="true"' : '') + '><span>' + o + '</span></div>').join('');

  function choose(i) {
    const btn = openSel, cfg = SELECTS[btn.dataset.select];
    cfg.value = cfg.options[i];

    toast(cfg.label + '：' + cfg.value + '（演示）');

  $('selectMenu').addEventListener('click', e => { const o = e.target.closest('[data-opt]'); if (o) choose(Number(o.dataset.opt)); });
  document.addEventListener('keydown', e => {
    if (!openSel) return;
    const n = SELECTS[openSel.dataset.select].options.length;
    if (e.key === 'ArrowDown') { active = (active + 1) % n; paintMenu(); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { active = (active - 1 + n) % n; paintMenu(); e.preventDefault(); }
    else if (e.key === 'Home') { active = 0; paintMenu(); e.preventDefault(); }
    else if (e.key === 'End') { active = n - 1; paintMenu(); e.preventDefault(); }
    else if (e.key === 'Enter' || e.key === ' ') { choose(active); e.preventDefault(); }

  /* ---------- 检查器 ---------- */
  let lastFocus = null;
  function openInspector(kind, title, quote, summary, meta) {
    lastFocus = document.activeElement;
    $('inspKind').textContent = kind; $('inspTitle').textContent = title;
    const cell = (k, v, cls) => '<div><span>' + k + '</span><strong class="' + (cls || '') + (v == null ? ' unknown' : '') + '">' + (v == null ? '未获取' : esc(v)) + '</strong></div>';
    $('inspBody').innerHTML = '<section class="tm-insp-sec"><h3>原文片段</h3><blockquote class="tm-insp-quote">' + esc(quote) + '</blockquote></section>'
      + '<section class="tm-insp-sec"><h3>内容摘要</h3><p>' + esc(summary) + '</p></section>'
      + (meta.stats ? '<section class="tm-insp-sec"><h3>互动数据</h3><div class="tm-insp-grid">' + cell('点赞', meta.likes == null ? null : fmt(meta.likes), 'n') + cell('收藏', meta.saves == null ? null : fmt(meta.saves), 'n') + cell('评论', meta.comments == null ? null : fmt(meta.comments), 'n') + cell('分享', meta.shares == null ? null : fmt(meta.shares), 'n') + '</div></section>' : '')
      + '<section class="tm-insp-sec"><h3>材料信息</h3><div class="tm-insp-grid two">' + cell('来源平台', meta.source) + cell('发布时间', meta.date) + cell('作者', meta.author) + cell('材料状态', '可阅读') + '</div></section>';
    $('inspector').classList.add('open'); $('inspector').setAttribute('aria-hidden', 'false'); $('scrim').classList.add('open');
    $('inspClose').focus();
  }
  function closeInspector() {
    $('inspector').classList.remove('open'); $('inspector').setAttribute('aria-hidden', 'true'); $('scrim').classList.remove('open');
    if (lastFocus && lastFocus.isConnected) lastFocus.focus();
  }

  function selectTopic(name) { const t = findTopic(name); if (t && t.parent) state.collapsed.delete(t.parent); state.topic = name; renderTree(); renderHead(); renderData(); renderTab(); $('main').scrollTo({ top: 0 }); }
  function setView(v) {
    state.view = v;
    document.querySelectorAll('button[data-view]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === v)));
    $('overviewPanel').hidden = v !== 'overview'; $('journeyPanel').hidden = v !== 'journey';
    $('topic-map-root').dataset.view = v;
    if (v === 'journey') renderJourney();
  }

  /* ---------- 事件 ---------- */
  document.addEventListener('click', e => {
    const el = e.target.closest('button,[data-stage],a');
    if (!el) return;
    if (el.dataset.select) { openSel === el ? closeSelect(true) : openSelect(el); return; }
    if (el.dataset.toggle) { const g = el.dataset.toggle; state.collapsed.has(g) ? state.collapsed.delete(g) : state.collapsed.add(g); renderTree(); return; }
    if (el.dataset.topic) { selectTopic(el.dataset.topic); return; }
    if (el.dataset.tab) { state.tab = el.dataset.tab; renderTab(); return; }
    if (el.dataset.filter) { state.filter = el.dataset.filter; document.querySelectorAll('[data-filter]').forEach(b => b.setAttribute('aria-pressed', String(b === el))); renderMaterials(); return; }
    if (el.dataset.chart) { state.chart = el.dataset.chart; renderData(); return; }
    if (el.dataset.view) { setView(el.dataset.view); return; }
    if (el.dataset.jmetric) { state.jmetric = el.dataset.jmetric; renderJourney(); return; }
    if (el.dataset.jdisplay) { state.jdisplay = el.dataset.jdisplay; renderJourney(); return; }
    if (el.dataset.stage) { state.stage = el.dataset.stage; renderJourney(); return; }
    if (el.dataset.open) { const m = MATERIALS[Number(el.dataset.open)]; openInspector('原文与讨论', m.title, m.quote, m.excerpt, { ...m, stats: true }); return; }
    if (el.dataset.scene) { const r = SCENES[state.stage][Number(el.dataset.scene)]; openInspector(state.stage + ' · 场景', r[0], r[2], r[3], { source: '小红书', author: null, date: null }); return; }
    if (el.dataset.save) { const i = Number(el.dataset.save); state.saved.has(i) ? state.saved.delete(i) : state.saved.add(i); renderMaterials(); toast(state.saved.has(i) ? '已保留为备选（演示，未写入）' : '已取消保留'); return; }
    if (el.dataset.bin) { toast('将按 ' + el.dataset.bin + ' 赞筛选材料（演示）'); return; }
    if (el.dataset.candidate) { toast('打开方向详情：' + el.dataset.candidate); return; }
    switch (el.id) {
      case 'inspClose': case 'inspCancel': closeInspector(); break;
      case 'inspLocate': toast('将定位到原始材料（演示）'); break;
      case 'matrixButton': toast('打开主题 × 旅程矩阵（演示）'); break;
      case 'ownSetup': toast('前往我方账号设置（演示）'); break;
    }
  });
  $('scrim').addEventListener('click', closeInspector);
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && $('inspector').classList.contains('open')) closeInspector();
    if (e.key === '/' && !e.ctrlKey && !e.metaKey && !e.altKey && !e.isComposing) {
      const t = e.target;
      if (t instanceof HTMLElement && (t.closest('input,textarea,select,[role=listbox]') || t.isContentEditable)) return;
      e.preventDefault(); (state.view === 'overview' && state.tab === 'materials' ? $('materialSearch') : $('treeSearch')).focus();
    }
  });
  wireFind($('treeFind'), renderTree);
  wireFind($('materialFind'), renderMaterials);

  hydrateIcons();
  selectTopic('全部方向');
  window.__tm = { selectTopic, setView, state, openInspector: () => document.querySelector('[data-open="2"]').click(), openSelect: () => openSelect(document.querySelector('[data-select=platform]')) };
})();

</script>
</body>
</html>
