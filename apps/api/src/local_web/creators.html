<!doctype html><html lang="zh-CN" data-theme="linggan-intelligence"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>创作者 · 语料</title><link rel="stylesheet" href="/assets/creators.css"></head><body><div class="v7-app">{{HEADER}}<div class="v7-shell">{{SIDE_NAV}}<main class="creators-main" aria-labelledby="creator-title">
<h1 id="creator-title" class="v7-sr-only">创作者</h1>
<form id="filters"><div class="creator-controls creator-toolbar"><label>搜索范围<select name="searchMode"><option value="author">作者</option><option value="work">作品内容</option></select></label><label class="creator-search">搜索<input name="query" type="search" placeholder="昵称、平台账号、公开简介" maxlength="200"></label><button type="button" id="refresh">刷新</button><button type="button" id="policy-open">发现设置</button></div>
<nav id="quick" class="creator-controls" aria-label="快捷筛选"><button type="button" data-quick="all" aria-describedby="quick-all-help" title="清除搜索和作者条件，保留领域、用途、平台和发表日期">范围内全部</button><span id="quick-all-help" class="v7-sr-only">清除搜索和作者条件，保留领域、用途、平台和发表日期。</span><button type="button" data-quick="outside">未纳入观察</button><button type="button" data-quick="high">名单外高赞</button><button type="button" data-quick="personal">个人亲历</button><button type="button" data-quick="vertical">垂类倾向</button></nav>
<details class="creator-scope"><summary id="scope-summary">筛选范围与概况</summary><div class="creator-controls"><label>领域<select name="domain" required><option value="">选择领域</option>{{DOMAINS}}</select></label><label>用途<select name="usageRole"><option value="primary">主研究</option><option value="reference">参照</option></select></label><label>平台<select name="platform"><option value="xhs">小红书</option></select></label><label>发表日期<select id="window"><option value="all">全部</option><option value="30">近30天</option><option value="90">近90天</option><option value="custom">自定义</option></select></label><label>开始<input name="publishedFrom" type="date"></label><label>结束（不含）<input name="publishedTo" type="date"></label></div>
<div id="stats" class="creator-stats" aria-label="基础范围统计"></div><p id="coverage"></p>
<details><summary>高级条件 · 不同条件取交集</summary><div class="creator-controls"><label class="creator-traits">来源特征（按住 ⌘／Ctrl 多选；未选即全部）<select name="traits" multiple size="4"><option value="personal_experience">个人亲历</option><option value="professional_output">专业输出</option><option value="explicit_promotion">明确推广</option><option value="institution_or_brand">机构／品牌</option></select></label><label>观察关系<select name="observation"><option value="">全部</option><option value="outside">未纳入</option><option value="inside">已纳入</option><option value="monitoring">巡查中</option><option value="paused">已暂停</option></select></label><label>最低点赞<input name="minLikes" type="number" min="0"></label><label>领域相关<select name="relevance"><option value="">全部</option><option value="related">相关</option><option value="unknown">待判断</option><option value="unrelated">无关</option></select></label><label>内容倾向<select name="focus"><option value="">全部</option><option value="vertical_tendency">垂类倾向</option><option value="multi_topic">多领域分享</option><option value="unknown">待判断</option></select></label><label><input name="viral" type="checkbox">有相关爆款</label><label><input name="highLikes" type="checkbox">高赞线索排序</label></div></details><button type="button" id="reset">重置条件</button></details></form>
<p id="status" role="status" aria-live="polite">请选择领域。</p>
<nav class="creator-pagination creator-controls" data-page-nav aria-label="表格前分页"><button type="button" data-page-prev disabled>上一页</button><span data-page-summary aria-live="polite"></span><button type="button" data-page-next disabled>下一页</button><form data-page-jump novalidate><label>跳转到第 <input data-page-input type="number" min="1" step="1" inputmode="numeric" aria-label="跳转页码" disabled> 页</label><button type="submit" disabled>跳转</button><span data-page-error role="status"></span></form><label>每页<select id="page-size"><option>25</option><option selected>50</option><option>100</option></select></label></nav>
<div class="creator-table-wrap" id="creator-results"><table><thead><tr><th>作者</th><th>内容线索</th><th>相关作品</th><th>爆款／表现</th><th>代表作品</th><th>观察关系</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div>
<nav class="creator-pagination creator-controls" data-page-nav aria-label="表格后分页"><button type="button" data-page-prev disabled>上一页</button><span data-page-summary aria-live="polite"></span><button type="button" data-page-next disabled>下一页</button><form data-page-jump novalidate><label>跳转到第 <input data-page-input type="number" min="1" step="1" inputmode="numeric" aria-label="跳转页码" disabled> 页</label><button type="submit" disabled>跳转</button><span data-page-error role="status"></span></form><label>每页<select data-page-size><option>25</option><option selected>50</option><option>100</option></select></label></nav>
</main></div></div>
<dialog id="drawer" class="creator-drawer" aria-labelledby="drawer-title"><header><h2 id="drawer-title">发现依据</h2><button id="drawer-close" aria-label="关闭发现依据">关闭</button></header><div id="drawer-body"></div></dialog>
<dialog id="policy-dialog" aria-labelledby="policy-title"><form id="policy-form"><h2 id="policy-title">当前领域的发现设置</h2><p>点赞标准只用于已有材料，不启动采集或模型调用。</p><label>爆款最低点赞（留空表示不设标准）<input id="threshold" type="number" min="1"></label><hr><label><input id="analysis-enabled" type="checkbox">启用本领域作品与创作者来源分析</label><p>仅处理本领域已有标题、正文及公开资料；使用下列模型配置与本用途每日额度，不采主页，不处理评论。</p><label>已有模型配置<select id="model-config"><option value="">选择模型配置</option></select></label><label>本用途每日词元上限<input id="daily-token-limit" type="number" min="1024" max="10000000"></label><a href="/settings/models">模型设置</a><p id="policy-status" role="status"></p><footer><button type="button" id="policy-close">取消</button><button type="submit">保存</button></footer></form></dialog>
<dialog id="correction-dialog" aria-labelledby="correction-title"><form id="correction-form"><h2 id="correction-title">人工纠正</h2><p id="correction-context"></p><label>当前判断<select id="correction-value" required></select></label><fieldset id="correction-support"><legend>支持这项判断的当前材料</legend><div id="support-options"></div></fieldset><label>纠正原因（可选）<textarea id="correction-reason" maxlength="300" rows="3" placeholder="说明你依据哪篇作品或公开资料判断"></textarea></label><p id="correction-status" role="status"></p><footer><button type="button" id="correction-restore">恢复自动判断</button><button type="button" id="correction-close">取消</button><button type="submit">保存纠正</button></footer></form></dialog><script src="/assets/creators.js" defer></script></body></html>
