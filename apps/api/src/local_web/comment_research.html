<!doctype html>
<html lang="zh-CN" data-theme="linggan-intelligence">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>评论研究 · Linggan Intelligence</title>
  <link rel="stylesheet" href="/assets/comment-research.css">
  <script src="/assets/comment-research.js" defer></script>
</head>
<body>
  <div class="v7-app">{{HEADER}}<div class="v7-shell">{{SIDE_NAV}}
    <main class="cr-v1" aria-labelledby="comment-research-title">
      <header class="cr-v1-heading">
        <div>
          <p class="cr-v1-kicker">评论研究</p>
          <h1 id="comment-research-title">从原声到可追溯的问题观察</h1>
          <p>只读取已发布的研究版本。原始评论保持原样；作品作者回复和身份未知评论不进入用户问题与变化统计。</p>
        </div>
        <div class="cr-v1-actions">
          <button type="button" id="research-settings">研究设置</button>
          <button type="button" id="start-run" class="cr-v1-primary">开始研究</button>
          <button type="button" id="refresh">刷新</button>
        </div>
      </header>

      <p id="research-status" class="cr-v1-status" role="status" aria-live="polite">正在读取研究状态…</p>
      <nav class="cr-v1-tabs" aria-label="评论研究视图">
        <button type="button" data-view="overview" aria-current="page">概览</button>
        <button type="button" data-view="voices">用户原声</button>
        <button type="button" data-view="problems">用户问题</button>
        <button type="button" data-view="changes">变化观察</button>
        <button type="button" data-view="runs">运行记录</button>
      </nav>
      <section id="research-result" aria-busy="true"></section>
    </main>
  </div></div>

  <dialog id="research-settings-dialog" class="cr-v1-dialog">
    <form id="research-settings-form">
      <header><div><p class="cr-v1-kicker">研究设置</p><h2>保存一次策略，之后可直接开始研究</h2></div><button type="button" data-close="research-settings-dialog">关闭</button></header>
      <p>保存不会发送评论或启动模型。开始研究只冻结当前可读的普通用户评论并交给后台推进；连续自动排程保持关闭。</p>
      <label>研究模型<input name="model" id="policy-model" disabled></label>
      <label>单轮评论上限<input name="sourceLimit" type="number" min="1" max="3000" required></label>
      <label>单轮研究模型额度（Token）<input name="tokenLimit" type="number" min="1024" max="10000000" required></label>
      <p class="cr-v1-note">这项额度约束本轮语义提取、向量候选和问题归并的所有外部调用。额度不足时，运行记录会如实标记未发布失败，不会继续发送请求。</p>
      <p id="embedding-state" class="cr-v1-note"></p>
      <p id="settings-feedback" class="cr-v1-status" role="status"></p>
      <footer><a href="/settings/models">前往模型与向量设置</a><button type="submit" class="cr-v1-primary">保存研究策略</button></footer>
    </form>
  </dialog>
</body>
</html>
