[package]
name = "linggan-worker"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
default-run = "linggan-worker"

[dependencies]
linggan-intelligence = { path = "../../crates/intelligence" }
linggan-evidence = { path = "../../crates/evidence" }
linggan-storage-postgres = { path = "../../crates/storage-postgres" }
sha2 = "0.11.0"
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "time"] }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
# 只给 `startup_contract` 用：它要读回 worker 写进心跳的那一行。产品的三条依赖里没有
# 数据库客户端——worker 自己不拼 SQL，SQL 都在 `linggan-evidence` 里。
sqlx.workspace = true

[[bin]]
name = "linggan-media-worker"
path = "src/bin/media_worker.rs"

[[bin]]
name = "linggan-media-requeue"
path = "src/bin/media_requeue.rs"
[[bin]]
name = "linggan-collection-repair"
path = "src/bin/collection_repair.rs"

[lints]
workspace = true
